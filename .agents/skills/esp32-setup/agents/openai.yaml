interface:
  display_name: "ESP32 - Set Up"
  short_description: "Set up a Tab5 with Console OS and games"
  default_prompt: "Use $esp32-setup to set up Console OS, ask whether I have a microSD card, and install basic games plus Doom with the supported storage route. Never require a firmware backup, snapshot or backup manifest for flashing. Flash without creating or refreshing a firmware backup; back up firmware only if I explicitly request a backup."
policy:
  allow_implicit_invocation: true
