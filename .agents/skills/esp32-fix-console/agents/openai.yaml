interface:
  display_name: "ESP32 - Fix Console"
  short_description: "Build, fix and test the Tab5 console OS"
  default_prompt: "Use $esp32-fix-console to diagnose or change the Tab5 Console OS and its shared platform services. Never require a firmware backup, snapshot or backup manifest for flashing. Flash without creating or refreshing a firmware backup; back up firmware only if I explicitly request a backup."
policy:
  allow_implicit_invocation: true
